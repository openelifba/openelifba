version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: open-elifba-db
    environment:
      POSTGRES_DB: openelifba
      POSTGRES_USER: openelifba
      POSTGRES_PASSWORD: openelifba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openelifba -d openelifba"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
